<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive สื่อเลขยกกำลัง ม.2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');
        
        body { 
            margin: 0; 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8fafc; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            position: relative;
            width: 100vw;
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding-bottom: 20px;
        }

        /* กล่องโจทย์ */
        .problem-box {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
            max-width: 600px;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1);
        }

        /* เมื่อกดเริ่มเฉลย (โจทย์ย้ายไปซ้ายบน ย่อเล็กลงอีกนิดเพื่อประหยัดที่) */
        .problem-box.solving {
            top: 15px;
            left: 20px;
            transform: translate(0, 0) scale(0.55);
            transform-origin: top left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin: 0;
            padding: 15px 25px;
        }

        .tags-container { margin-bottom: 10px; }
        .tag { 
            background: #dbeafe; color: #1e3a8a; padding: 4px 12px; 
            border-radius: 20px; font-size: 14px; margin: 4px; display: inline-block; 
            font-weight: 600;
        }
        .problem-display { font-size: 34px; margin: 15px 0; min-height: 60px; }

        /* พื้นที่แสดงวิธีทำตรงกลาง ขยายความกว้างเพื่อรองรับ 2 ฝั่ง */
        .solution-area {
            position: relative;
            margin-top: 80px; 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            gap: 8px; /* ลดช่องว่างเพื่อให้ 7 บรรทัดพอดีจอ */
            padding: 0 20px;
            margin-left: 100px; /* หลบปุ่มด้านซ้าย */
        }

        /* กล่องวิธีทำ แบ่งเป็น 2 ส่วน (สมการ และ คำอธิบาย) */
        .step-card {
            background: white;
            padding: 5px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* Flex สำหรับแบ่งครึ่ง */
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .step-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ฝั่งซ้าย: สมการคณิตศาสตร์ */
        .math-part {
            flex: 0 0 45%; /* กินพื้นที่ 45% */
            text-align: right;
            padding-right: 20px;
            font-size: 24px; 
            border-right: 2px dashed #cbd5e1; /* เส้นประคั่นกลาง */
        }
        /* ดัดแปลง KaTeX ไม่ให้มีระยะขอบบนล่างเยอะเกินไป */
        .math-part .katex-display { margin: 10px 0; }

        /* ฝั่งขวา: คำอธิบายภาษาไทย */
        .desc-part {
            flex: 1; /* กินพื้นที่ที่เหลือ */
            text-align: left;
            padding-left: 20px;
            font-size: 18px;
            color: #475569;
            font-weight: 600;
        }

        /* แถบควบคุม (ซ้ายล่าง และโปร่งแสง) */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 20px; 
            background: rgba(255, 255, 255, 0.2); 
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            backdrop-filter: blur(8px); 
            display: flex;
            flex-direction: column; 
            gap: 12px;
            z-index: 20;
            opacity: 0.3; 
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        .controls:hover, .controls:active {
            opacity: 1; 
            background: rgba(255, 255, 255, 0.85);
        }

        button { 
            border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; 
            font-size: 16px; font-family: 'Sarabun'; font-weight: 700;
            transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%;
        }
        button:active { transform: scale(0.95); }
        .btn-random { background: #64748b; }
        .btn-random:hover { background: #475569; }
        .btn-solve { background: #8b5cf6; }
        .btn-solve:hover { background: #7c3aed; }
        .btn-next { background: #ef4444; display: none; }
        .btn-next:hover { background: #dc2626; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="problem-box" id="problem-box">
            <h2 style="color: #334155; margin-top: 0; font-size: 22px;">จงหาผลลัพธ์</h2>
            <div class="tags-container" id="tags"></div>
            <div class="problem-display" id="problem"></div>
        </div>

        <div class="solution-area" id="solution-area"></div>
    </div>

    <div class="controls">
        <button class="btn-random" onclick="loadRandomProblem()">🎲 สุ่มโจทย์ใหม่</button>
        <button class="btn-solve" id="btn-start" onclick="startSolve()">▶️ เริ่มเฉลย</button>
        <button class="btn-next" id="btn-next" onclick="showNextStep()">⬇️ เฉลยขั้นต่อไป</button>
    </div>

    <script>
        // เปลี่ยนแปลงโครงสร้างข้อมูล เพื่อให้มีคำอธิบาย .desc ในแต่ละขั้น
        const mathProblems = [
            {
                problem: "\\frac{(x^2 y^{-3})^2}{x^{-4} y^2}",
                properties: ["ยกกำลังนอกวงเล็บ", "กำลังซ้อน", "สมบัติการหาร", "เลขชี้กำลังติดลบ"],
                steps: [
                    { eq: "\\frac{\\textcolor{red}{(x^2)^2 (y^{-3})^2}}{x^{-4} y^2}", desc: "กระจายเลขชี้กำลังนอกวงเล็บเข้าไปคูณด้านใน" },
                    { eq: "\\frac{\\textcolor{red}{x^4 y^{-6}}}{x^{-4} y^2}", desc: "คำนวณกำลังซ้อน (นำเลขชี้กำลังมาคูณกัน)" },
                    { eq: "\\textcolor{red}{x^{4 - (-4)} y^{-6 - 2}}", desc: "ฐานเหมือนกันหารกัน ให้นำเลขชี้กำลังตัวเศษลบตัวส่วน" },
                    { eq: "x^{\\textcolor{red}{4 + 4}} y^{\\textcolor{red}{-8}}", desc: "เปลี่ยนลบซ้อนลบเป็นบวก และคำนวณผลลบ" },
                    { eq: "x^{\\textcolor{red}{8}} y^{-8}", desc: "ได้ผลลัพธ์การบวกลบเลขชี้กำลัง" },
                    { eq: "\\frac{x^8}{\\textcolor{red}{y^8}}", desc: "เปลี่ยนกำลังติดลบให้เป็นบวก โดยย้ายลงมาเป็นตัวส่วน" }
                ]
            },
            {
                problem: "(-3)^2 \\times \\left((-3)^{-2}\\right)^3",
                properties: ["ฐานเป็นลบยกกำลังคู่", "กำลังซ้อน", "สมบัติการคูณ", "เลขชี้กำลังติดลบ"],
                steps: [
                    { eq: "(-3)^2 \\times \\textcolor{red}{(-3)^{-2 \\times 3}}", desc: "นำเลขชี้กำลังที่ซ้อนกันมาคูณกัน (กำลังซ้อน)" },
                    { eq: "(-3)^2 \\times \\textcolor{red}{(-3)^{-6}}", desc: "ได้ผลคูณของเลขชี้กำลัง" },
                    { eq: "\\textcolor{red}{(-3)^{2 + (-6)}}", desc: "ฐานเหมือนกันคูณกัน ให้นำเลขชี้กำลังมาบวกกัน" },
                    { eq: "(-3)^{\\textcolor{red}{-4}}", desc: "ได้ผลบวกของเลขชี้กำลัง" },
                    { eq: "\\textcolor{red}{\\frac{1}{(-3)^4}}", desc: "ย้ายลงมาเป็นตัวส่วน เพื่อให้เลขชี้กำลังติดลบกลายเป็นบวก" },
                    { eq: "\\frac{1}{\\textcolor{red}{3^4}}", desc: "ฐานติดลบยกกำลังด้วยจำนวนคู่ ผลลัพธ์ฐานจะมีค่าเป็นบวก" },
                    { eq: "\\frac{1}{\\textcolor{red}{81}}", desc: "คำนวณค่าของ 3 ยกกำลัง 4 ได้ผลลัพธ์สุดท้าย" }
                ]
            },
            {
                problem: "\\left( \\frac{2 a^{-1}}{b^2} \\right)^{-3}",
                properties: ["ยกกำลังนอกวงเล็บ", "กำลังซ้อน", "เลขชี้กำลังติดลบ"],
                steps: [
                    { eq: "\\frac{\\textcolor{red}{2^{-3} (a^{-1})^{-3}}}{\\textcolor{red}{(b^2)^{-3}}}", desc: "กระจายเลขชี้กำลัง -3 นอกวงเล็บ เข้าไปคูณทั้งเศษและส่วน" },
                    { eq: "\\frac{2^{-3} \\textcolor{red}{a^3}}{\\textcolor{red}{b^{-6}}}", desc: "คำนวณผลคูณของเลขชี้กำลัง (ลบคูณลบเป็นบวก)" },
                    { eq: "\\textcolor{red}{\\frac{a^3 b^6}{2^3}}", desc: "ย้ายฐานสลับเศษส่วน เพื่อให้เลขชี้กำลังที่ติดลบกลายเป็นบวก" },
                    { eq: "\\frac{a^3 b^6}{\\textcolor{red}{8}}", desc: "คำนวณค่า 2 ยกกำลัง 3 ได้ผลลัพธ์สุดท้าย" }
                ]
            },
            {
                problem: "\\frac{(-2)^4 \\times 2^{-3}}{2^{-1}}",
                properties: ["ฐานเป็นลบยกกำลังคู่", "สมบัติการคูณ", "สมบัติการหาร", "เลขชี้กำลังติดลบ"],
                steps: [
                    { eq: "\\frac{\\textcolor{red}{2^4} \\times 2^{-3}}{2^{-1}}", desc: "ฐานติดลบยกกำลังคู่ เปลี่ยนเป็นฐานบวกได้เลย" },
                    { eq: "\\frac{\\textcolor{red}{2^{4 + (-3)}}}{2^{-1}}", desc: "ฐานเหมือนกันคูณกัน นำเลขชี้กำลังมาบวกกัน" },
                    { eq: "\\frac{\\textcolor{red}{2^1}}{2^{-1}}", desc: "คำนวณผลบวกเลขชี้กำลังของตัวเศษ" },
                    { eq: "\\textcolor{red}{2^{1 - (-1)}}", desc: "ฐานเหมือนกันหารกัน นำเลขชี้กำลังมาลบกัน" },
                    { eq: "2^{\\textcolor{red}{2}}", desc: "เปลี่ยนลบซ้อนลบเป็นบวก (1 + 1 = 2)" },
                    { eq: "\\textcolor{red}{4}", desc: "คำนวณค่า 2 ยกกำลัง 2 ได้ผลลัพธ์สุดท้าย" }
                ]
            }
        ];

        let currentProblem = null;
        let currentStepIndex = 0;

        function loadRandomProblem() {
            const problemBox = document.getElementById('problem-box');
            problemBox.classList.remove('solving');
            
            document.getElementById('solution-area').innerHTML = '';
            currentStepIndex = 0;

            document.getElementById('btn-start').style.display = 'flex';
            document.getElementById('btn-next').style.display = 'none';

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * mathProblems.length);
            } while (mathProblems[randomIndex] === currentProblem && mathProblems.length > 1);
            
            currentProblem = mathProblems[randomIndex];

            const tagsDiv = document.getElementById('tags');
            tagsDiv.innerHTML = currentProblem.properties.map(prop => `<span class="tag">${prop}</span>`).join('');

            katex.render(currentProblem.problem, document.getElementById('problem'), { displayMode: true });
        }

        function startSolve() {
            document.getElementById('problem-box').classList.add('solving');
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-next').style.display = 'flex';

            const solArea = document.getElementById('solution-area');
            solArea.innerHTML = '';
            
            currentProblem.steps.forEach((stepObj, index) => {
                // สร้างกล่องหลัก
                const stepCard = document.createElement('div');
                stepCard.className = 'step-card';
                stepCard.id = 'step-' + index;

                // สร้างฝั่งซ้าย (สมการ)
                const mathPart = document.createElement('div');
                mathPart.className = 'math-part';
                katex.render("= " + stepObj.eq, mathPart, { displayMode: true });

                // สร้างฝั่งขวา (คำอธิบาย)
                const descPart = document.createElement('div');
                descPart.className = 'desc-part';
                descPart.innerText = stepObj.desc;

                // นำมาประกอบกัน
                stepCard.appendChild(mathPart);
                stepCard.appendChild(descPart);
                solArea.appendChild(stepCard);
            });
        }

        function showNextStep() {
            if (currentStepIndex < currentProblem.steps.length) {
                const currentCard = document.getElementById('step-' + currentStepIndex);
                currentCard.classList.add('visible');
                currentStepIndex++;
            }

            if (currentStepIndex >= currentProblem.steps.length) {
                document.getElementById('btn-next').style.display = 'none';
            }
        }

        window.onload = loadRandomProblem;
    </script>
</body>
</html>
